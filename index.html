<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majestic Tracker | Multi-Server</title>
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #cccccc;
            --accent-color: #e6007e;
            --success: #10b981;
            --danger: #ef4444;
            --glass-bg: rgba(30, 30, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(230, 0, 126, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: relative;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            text-transform: capitalize;
            position: relative;
            display: inline-block;
            color: white;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
        }

        .logo::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 47px;
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .current-server-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .burger-menu {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
            background: #e6007e;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(230, 0, 126, 0.4);
            transition: all 0.2s;
        }

        .burger-menu:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(230, 0, 126, 0.7);
        }

        .burger-menu div {
            width: 25px;
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }

        .server-menu {
            position: absolute;
            top: 100%;
            right: 0;
            width: 320px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 0 var(--border-radius);
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--glass-shadow);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .server-menu.open {
            transform: translateX(0);
        }

        .server-btn {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
            text-transform: capitalize;
        }

        .server-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255,255,255,0.3);
        }

        .server-btn.active-server {
            background: rgba(192, 38, 211, 0.2);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(230, 0, 126, 0.2);
        }

        .server-btn img {
            width: 24px;
            height: 24px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 15px;
            background-color: #111;
        }

        .layout {
            display: flex;
            flex: 1;
            padding: 20px 30px;
            gap: 20px;
            align-items: flex-start;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1000px;
            margin-right: auto;
        }

        .finance-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            font-size: 18px;
            font-weight: bold;
            flex-wrap: wrap;
        }

        .finance-item {
            display: flex;
            gap: 5px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.5s ease;
        }

        .finance-item.show {
            opacity: 1;
            transform: translateY(0);
        }

        .finance-item.buy { color: var(--danger); }
        .finance-item.sell { color: var(--success); }

        .total-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .total-balance {
            font-size: 22px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--border-radius);
            border: 1px solid var(--glass-border);
            transition: color 0.3s, border-color 0.3s;
        }

        .total-balance.positive { color: var(--success); border-color: rgba(16, 185, 129, 0.5); }
        .total-balance.negative { color: var(--danger); border-color: rgba(239, 68, 68, 0.5); }

        .tracker-gif {
            height: 30px;
            width: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .tracker-gif.show {
            opacity: 1;
        }

        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--glass-shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            padding: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            font-size: 14px;
            text-transform: uppercase;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .action-type {
            font-weight: bold;
        }
        .action-type.buy-text { color: var(--danger); }
        .action-type.sell-text { color: var(--success); }
        .action-type.installment-text { color: #eab308; }

        .info-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: bold;
            cursor: help;
            position: relative;
        }

        .info-icon:hover::after {
            content: attr(data-info);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            white-space: pre;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            margin-bottom: 5px;
        }

        .right-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--glass-shadow);
            margin-left: auto;
        }

        .right-panel h3 {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-reset {
            margin-top: 20px;
            border-color: rgba(239, 68, 68, 0.3);
            color: #ff8a8a;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: var(--border-radius);
            width: 400px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.6);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--glass-border);
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 0 0 6px 6px;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        .autocomplete-items div:hover {
            background-color: rgba(230, 0, 126, 0.3);
        }

        .ac-price {
            font-size: 12px;
            color: var(--text-muted);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            flex: 1;
        }

        .btn-submit {
            background: var(--accent-color);
            color: white;
            border: 1px solid transparent;
            flex: 1;
        }

        .btn-submit:hover {
            background: #b80065;
            border-color: rgba(255,255,255,0.2);
        }

        .color-profit { color: var(--success); font-weight: bold; }
        .color-loss { color: var(--danger); font-weight: bold; }

        .notification {
            display: none;
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border-radius: var(--border-radius);
            animation: fadeInOut 2s forwards;
        }

        .notification.profit {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .notification.loss {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">Majestic</div>
            <div class="current-server-badge" id="currentServerName">Memphis</div>
        </div>
        
        <div class="burger-menu" id="burgerMenu">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="server-menu" id="serverMenu"></div>
    </header>

    <div class="layout">
        <div class="main-content">
            <div class="finance-panel">
                <div class="finance-item buy" id="finBuy">Купил: 0</div>
                <div class="finance-item sell" id="finSell">Продал: 0</div>
                <div class="total-block">
                    <div class="total-balance" id="totalBalance">Итог: 0</div>
                    <img src="media/123.gif" id="trackerGif" class="tracker-gif" alt="tracker">
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Действие</th>
                            <th>Предмет</th>
                            <th>Инфо</th>
                            <th>Цена</th>
                            <th>Средний рынок</th>
                            <th>Гос. стоимость</th>
                            <th>Разница / Детали</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="right-panel">
            <h3>Управление сделками</h3>
            <button class="btn" onclick="openModal('buy')">Купил</button>
            <button class="btn" onclick="openModal('sell')">Продал</button>
            <button class="btn" onclick="openModal('installment')">Рассрочка</button>
            <button class="btn btn-reset" onclick="resetAll()">Сбросить сервер</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Действие</h2>
            <form id="actionForm">
                
                <div class="form-group">
                    <label>Название предмета (транспорта)</label>
                    <input type="text" id="carName" required autocomplete="off">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>

                <div class="form-group">
                    <label>Цена покупки/продажи</label>
                    <input type="number" id="price" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="useGovPrice" onchange="toggleGovPriceField()">
                    <label for="useGovPrice" style="margin:0; cursor:pointer;">Указать гос. стоимость</label>
                </div>

                <div class="form-group" id="govPriceGroup" style="display: none;">
                    <label>Гос. стоимость</label>
                    <input type="number" id="govPrice">
                </div>

                <div class="form-group">
                    <label>Средний рынок</label>
                    <input type="number" id="marketPrice" required>
                </div>
                
                <div id="installmentFields" style="display: none;">
                    <div class="form-group">
                        <label>У кого купил</label>
                        <input type="text" id="sellerName">
                    </div>
                    <div class="form-group">
                        <label>Сумма платежа (в день/неделю)</label>
                        <input type="number" id="paymentAmount">
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">Подтвердить</button>
                </div>
                
                <div id="notification" class="notification"></div>
            </form>
        </div>
    </div>

        let globalState = {};
        let activeServer = "memphis";
        let currentAction = null;

        function loadGlobalState() {
            const saved = localStorage.getItem('majesticTrackerGlobal');
            if (saved) {
                try {
                    globalState = JSON.parse(saved);
                } catch (e) {
                    console.error("Ошибка загрузки данных");
                    globalState = {};
                }
            }
            
            servers.forEach(server => {
                if (!globalState[server]) {
                    globalState[server] = {
                        logs: [],
                        totalBuy: 0,
                        totalSell: 0,
                        marketDatabase: {}
                    };
                }
            });
        }

        function saveGlobalState() {
            localStorage.setItem('majesticTrackerGlobal', JSON.stringify(globalState));
        }

        function formatMoney(amount) {
            amount = Math.abs(amount);
            if (amount >= 1000000) {
                return (amount / 1000000).toFixed(1).replace('.0', '') + 'kk';
            } else if (amount >= 1000) {
                return (amount / 1000).toFixed(1).replace('.0', '') + 'k';
            }
            return amount.toString();
        }

        const serverMenu = document.getElementById('serverMenu');
        servers.forEach((server, index) => {
            const btn = document.createElement('button');
            btn.className = 'server-btn';
            btn.id = `btn-${server}`;
            btn.onclick = () => switchServer(server);
            btn.innerHTML = `
                <img src="media/${index + 1}.png" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'24\\' height=\\'24\\'><rect width=\\'24\\' height=\\'24\\' fill=\\'%23333\\'/></svg>'">
                <span>${server.charAt(0).toUpperCase() + server.slice(1)}</span>
            `;
            serverMenu.appendChild(btn);
        });

        function switchServer(serverName) {
            if (activeServer === serverName) {
                serverMenu.classList.remove('open');
                return;
            }
            
            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active-server'));
            document.getElementById(`btn-${serverName}`).classList.add('active-server');
            activeServer = serverName;
            document.getElementById('currentServerName').innerText = serverName.charAt(0).toUpperCase() + serverName.slice(1);
            render();
            serverMenu.classList.remove('open');
        }

        document.getElementById('burgerMenu').addEventListener('click', () => {
            serverMenu.classList.toggle('open');
        });

        loadGlobalState();
        document.getElementById(`btn-memphis`).classList.add('active-server');
        render();

        function toggleGovPriceField() {
            const checkbox = document.getElementById('useGovPrice');
            const group = document.getElementById('govPriceGroup');
            if (checkbox.checked) {
                group.style.display = 'block';
            } else {
                group.style.display = 'none';
                document.getElementById('govPrice').value = '';
            }
        }

        function openModal(action) {
            currentAction = action;
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const installmentFields = document.getElementById('installmentFields');
            const notification = document.getElementById('notification');
            
            document.getElementById('actionForm').reset();
            document.getElementById('govPriceGroup').style.display = 'none';
            document.getElementById('autocomplete-list').style.display = 'none';
            notification.style.display = 'none';
            notification.className = 'notification';
            
            if (action === 'buy') {
                title.innerText = 'Купить предмет';
                installmentFields.style.display = 'none';
            } else if (action === 'sell') {
                title.innerText = 'Продать предмет';
                installmentFields.style.display = 'none';
            } else if (action === 'installment') {
                title.innerText = 'Взять в рассрочку';
                installmentFields.style.display = 'block';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function resetAll() {
            const confirmed = confirm(`Вы уверены, что хотите полностью сбросить все данные на сервере ${activeServer.toUpperCase()}? Это действие нельзя отменить.`);
            if (confirmed) {
                globalState[activeServer] = {
                    logs: [],
                    totalBuy: 0,
                    totalSell: 0,
                    marketDatabase: {}
                };
                saveGlobalState();
                render();
            }
        }

        const carNameInput = document.getElementById('carName');
        const autocompleteList = document.getElementById('autocomplete-list');

        carNameInput.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            autocompleteList.innerHTML = '';
            
            if (!val) {
                autocompleteList.style.display = 'none';
                return;
            }

            let matches = [];
            for (const key in vehiclesDatabase) {
                if (key.toLowerCase().includes(val)) {
                    matches.push(key);
                }
            }

            if (matches.length > 0) {
                autocompleteList.style.display = 'block';
                matches.slice(0, 10).forEach(match => {
                    const div = document.createElement('div');
                    const regex = new RegExp(`(${val})`, "gi");
                    const data = vehiclesDatabase[match];
                    const scrapPrice = data.gov / 2; // Автоматический расчет свалки
                    
                    div.innerHTML = `
                        <span>${match.replace(regex, "<strong>$1</strong>")}</span>
                        <span class="ac-price">Гос: ${formatMoney(data.gov)} / Свалка: ${formatMoney(scrapPrice)}</span>
                    `;
                    
                    div.addEventListener('click', function() {
                        carNameInput.value = match;
                        autocompleteList.style.display = 'none';
                        
                        if (document.getElementById('useGovPrice').checked) {
                            document.getElementById('govPrice').value = data.gov;
                        }
                    });
                    autocompleteList.appendChild(div);
                });
            } else {
                autocompleteList.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (e.target !== carNameInput) {
                autocompleteList.style.display = 'none';
            }
        });

        document.getElementById('carName').addEventListener('input', function(e) {
            const name = e.target.value.toLowerCase().trim();
            const db = globalState[activeServer].marketDatabase;
            if (db[name]) {
                document.getElementById('marketPrice').value = db[name];
            }
        });

        document.getElementById('actionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const carName = document.getElementById('carName').value.trim();
            const price = parseFloat(document.getElementById('price').value);
            const marketPrice = parseFloat(document.getElementById('marketPrice').value);
            const useGov = document.getElementById('useGovPrice').checked;
            const govPrice = useGov ? parseFloat(document.getElementById('govPrice').value) || 0 : 0;
            
            const notification = document.getElementById('notification');
            
            globalState[activeServer].marketDatabase[carName.toLowerCase()] = marketPrice;

            let difference = price - marketPrice;
            let actionText = '';
            let diffText = '';
            let extraInfo = '';

            if (currentAction === 'buy') {
                if (difference <= 0) {
                    notification.innerText = `Вы в плюсе на ${formatMoney(Math.abs(difference))} (Купили дешевле)`;
                    notification.classList.add('profit');
                } else {
                    notification.innerText = `Вы в минусе на ${formatMoney(difference)} (Купили дороже)`;
                    notification.classList.add('loss');
                }
            } else if (currentAction === 'sell') {
                if (difference >= 0) {
                    notification.innerText = `Вы в плюсе на ${formatMoney(difference)} (Продали дороже)`;
                    notification.classList.add('profit');
                } else {
                    notification.innerText = `Вы в минусе на ${formatMoney(Math.abs(difference))} (Продали дешевле)`;
                    notification.classList.add('loss');
                }
            } else {
                if (difference <= 0) {
                    notification.innerText = `Выгодная сделка (дешевле на ${formatMoney(Math.abs(difference))})`;
                    notification.classList.add('profit');
                } else {
                    notification.innerText = `Переплата (дороже на ${formatMoney(difference)})`;
                    notification.classList.add('loss');
                }
            }
            
            notification.style.display = 'block';
            notification.style.animation = 'none';
            notification.offsetHeight; 
            notification.style.animation = null; 

            document.getElementById('submitBtn').disabled = true;

            setTimeout(() => {
                document.getElementById('submitBtn').disabled = false;

                if (currentAction === 'buy') {
                    actionText = 'Купил';
                    diffText = difference <= 0 
                        ? `<span class="color-profit">Дешевле рынка на ${formatMoney(difference)}</span>`
                        : `<span class="color-loss">Дороже рынка на ${formatMoney(difference)}</span>`;
                    globalState[activeServer].totalBuy += price;
                } else if (currentAction === 'sell') {
                    actionText = 'Продал';
                    diffText = difference >= 0 
                        ? `<span class="color-profit">Дороже рынка на ${formatMoney(difference)}</span>`
                        : `<span class="color-loss">Дешевле рынка на ${formatMoney(difference)}</span>`;
                    globalState[activeServer].totalSell += price;
                } else if (currentAction === 'installment') {
                    actionText = 'Рассрочка';
                    const seller = document.getElementById('sellerName').value.trim();
                    const payment = parseFloat(document.getElementById('paymentAmount').value) || 0;
                    extraInfo = `Продавец: ${seller} | Платеж: ${formatMoney(payment)}`;
                    diffText = difference <= 0 
                        ? `<span class="color-profit">Выгодно на ${formatMoney(difference)}</span>`
                        : `<span class="color-loss">Переплата ${formatMoney(difference)}</span>`;
                }

                // Получаем доп инфу для таблицы
                const dbItem = vehiclesDatabase[carName];
                let infoString = "Нет данных";
                if (dbItem) {
                    infoString = `Топливо: ${dbItem.fuel}\nВес: ${dbItem.weight}`;
                    if (dbItem.mcoin) infoString += `\nM-Coins: ${dbItem.mcoin}`;
                }

                const logEntry = {
                    id: Date.now(),
                    action: currentAction,
                    actionText: actionText,
                    carName: carName,
                    price: price,
                    marketPrice: marketPrice,
                    govPrice: govPrice,
                    diffHtml: diffText,
                    extraInfo: extraInfo,
                    infoString: infoString
                };

                globalState[activeServer].logs.push(logEntry);
                saveGlobalState();
                render();
                closeModal();
            }, 2000);
        });

        function render() {
            const serverData = globalState[activeServer];
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            serverData.logs.forEach(log => {
                const tr = document.createElement('tr');
                
                let actionClass = 'buy-text';
                if (log.action === 'sell') actionClass = 'sell-text';
                if (log.action === 'installment') actionClass = 'installment-text';

                // Формируем иконку инфо
                const infoTooltip = log.infoString || "Нет данных";
                const infoHtml = `<div class="info-icon" data-info="${infoTooltip}">i</div>`;

                tr.innerHTML = `
                    <td class="action-type ${actionClass}">${log.actionText}</td>
                    <td>${log.carName}</td>
                    <td>${infoHtml}</td>
                    <td>${formatMoney(log.price)}</td>
                    <td>${formatMoney(log.marketPrice)}</td>
                    <td>${log.govPrice ? formatMoney(log.govPrice) : '-'}</td>
                    <td>${log.diffHtml} ${log.extraInfo ? `<br><small style="color:#aaa">${log.extraInfo}</small>` : ''}</td>
                `;
                tbody.appendChild(tr);
            });

            const finBuy = document.getElementById('finBuy');
            const finSell = document.getElementById('finSell');
            const totalBalance = document.getElementById('totalBalance');
            const trackerGif = document.getElementById('trackerGif');

            if (serverData.totalBuy > 0) {
                finBuy.classList.add('show');
                finBuy.innerHTML = `Купил: ${formatMoney(serverData.totalBuy)}`;
            } else {
                finBuy.classList.remove('show');
            }

            if (serverData.totalSell > 0) {
                finSell.classList.add('show');
                finSell.innerHTML = `Продал: ${formatMoney(serverData.totalSell)}`;
            } else {
                finSell.classList.remove('show');
            }

            const balance = serverData.totalSell - serverData.totalBuy;
            totalBalance.classList.remove('positive', 'negative');
            
            if (balance > 0) {
                totalBalance.classList.add('positive');
                totalBalance.innerHTML = `Итог: +${formatMoney(balance)}`;
            } else if (balance < 0) {
                totalBalance.classList.add('negative');
                totalBalance.innerHTML = `Итог: -${formatMoney(balance)}`;
            } else {
                totalBalance.innerHTML = `Итог: 0`;
            }

            if (serverData.logs.length > 0) {
                trackerGif.classList.add('show');
            } else {
                trackerGif.classList.remove('show');
            }
        }
